<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" width="1000" height="326" role="img" aria-labelledby="t d"><title id="t">LM head in-model</title><desc id="d">Blocks of 256 logits, per-block max and argmax, hard-max attention over block winners, 36 dual-rail bits decoded by the outer lm_head.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--panel:#f6f8fa;
--state:#0969da;--statef:#ddf4ff;--op:#9a6700;--opf:#fff8c5;--att:#1a7f37;--attf:#dafbe1;--host:#57606a;--hostf:#eaeef2;--bad:#cf222e;--badf:#ffebe9;--acc:#8250df;--accf:#fbefff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--panel:#151b23;
--state:#4493f8;--statef:#0c2d6b;--op:#d4a72c;--opf:#3b2e00;--att:#3fb950;--attf:#0f3a1b;--host:#9198a1;--hostf:#262c36;--bad:#ff7b72;--badf:#4a1a1a;--acc:#bc8cff;--accf:#2d1b4e}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:20px;font-weight:600}.s{font-size:12px;fill:var(--mut)}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.wt{fill:#fff}.c{text-anchor:middle}.r{text-anchor:end}
.bg{fill:var(--bg)}.pn{fill:var(--panel);stroke:var(--line)}
.st{fill:var(--statef);stroke:var(--state);stroke-width:1.5}.op{fill:var(--opf);stroke:var(--op);stroke-width:1.5}
.at{fill:var(--attf);stroke:var(--att);stroke-width:1.5}.ho{fill:var(--hostf);stroke:var(--host);stroke-width:1.5}
.ac{fill:var(--accf);stroke:var(--acc);stroke-width:1.5}.bd{fill:var(--badf);stroke:var(--bad);stroke-width:1.5}
.ln{stroke:var(--mut);stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 5}
.flow{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs><rect class="bg" width="1000" height="326" rx="8"/><text x="24" y="34" class="t">Full-vocabulary LM head and argmax, in-model</text><text x="24" y="54" class="s">Logits for 151,936 tokens are produced in 594 blocks of 256; the argmax is a two-level hard max done by outer layers.</text><rect class="st" x="24" y="96" width="214" height="120" rx="8"/><text x="131.0" y="124" class="b c">Blocks of logits</text><text x="131.0" y="152" class="s c">594 blocks x 256 logits</text><text x="131.0" y="172" class="s c">state-bank matvec on the</text><text x="131.0" y="192" class="s c">151,936 x 1024 head weights</text><path d="M240 156.0 L260 156.0" class="ln flow" marker-end="url(#ar)" /><rect class="op" x="262" y="96" width="214" height="120" rx="8"/><text x="369.0" y="124" class="b c">Per-block tournament</text><text x="369.0" y="152" class="s c">max and local argmax</text><text x="369.0" y="172" class="s c">inside each block</text><text x="369.0" y="192" class="s c">output: best logit + 8 bits</text><path d="M478 156.0 L498 156.0" class="ln flow" marker-end="url(#ar)" /><rect class="at" x="500" y="96" width="214" height="120" rx="8"/><text x="607.0" y="124" class="b c">Hard-max attention</text><text x="607.0" y="152" class="s c">key = block best logit</text><text x="607.0" y="172" class="s c">value = 36 dual-rail bits</text><text x="607.0" y="192" class="s c">(8 local + 10 block index)</text><path d="M716 156.0 L736 156.0" class="ln flow" marker-end="url(#ar)" /><rect class="ho" x="738" y="96" width="214" height="120" rx="8"/><text x="845.0" y="124" class="b c">Outer lm_head</text><text x="845.0" y="152" class="s c">36 non-zero columns</text><text x="845.0" y="172" class="s c">decode rails -> token id</text><text x="845.0" y="192" class="s c">host: argmax + append</text><text x="24" y="262" class="s">softmax over block winners is a hard max: the winning block gets weight 1 - e^-40 when the top-2 gap exceeds 1e-3, so the value read out is its code.</text><text x="24" y="282" class="s">Full-token run (real Qwen3-0.6B): outer argmax 15846 == Hugging Face; block-best logit error 5.8e-5 of max|logit|; winning rails clean (score 18.0007 of ideal 18).</text><text x="24" y="302" class="s">Exact ties blend the code and give an invalid token id; the op test notes this is practically never hit (experiments/ops/README.md).</text></svg>