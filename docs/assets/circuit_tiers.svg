<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Tier ladder</title><desc>Instructions per token for the tiers of the circuit route, on a log scale; measured tiers solid, projected tiers hatched</desc><defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b1b3a" flood-opacity="0.07"/></filter><linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#4338CA"/></linearGradient><pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#C7D2FE" stroke-width="3"/></pattern></defs><rect width="1280" height="520" fill="#FFFFFF"/><text x="48" y="54" font-size="26" font-weight="700" fill="#111827" text-anchor="start">The tier ladder</text><text x="48" y="78" font-size="14" font-weight="400" fill="#6B7280" text-anchor="start">instructions per generated token (log scale), Qwen3-0.6B as a program on the circuit, ctx 1</text><line x1="485.0" y1="100" x2="485.0" y2="430" stroke="#F3F4F6"/><text x="485.0" y="452" font-size="12" font-weight="400" fill="#9CA3AF" text-anchor="middle">1e8</text><line x1="695.0" y1="100" x2="695.0" y2="430" stroke="#F3F4F6"/><text x="695.0" y="452" font-size="12" font-weight="400" fill="#9CA3AF" text-anchor="middle">1e9</text><line x1="905.0" y1="100" x2="905.0" y2="430" stroke="#F3F4F6"/><text x="905.0" y="452" font-size="12" font-weight="400" fill="#9CA3AF" text-anchor="middle">1e10</text><line x1="1115.0" y1="100" x2="1115.0" y2="430" stroke="#F3F4F6"/><text x="1115.0" y="452" font-size="12" font-weight="400" fill="#9CA3AF" text-anchor="middle">1e11</text><text x="48" y="136" font-size="18" font-weight="700" fill="#111827" text-anchor="start">T0</text><text x="104" y="136" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">fp32 soft-float firmware</text><rect x="380" y="116" width="743.7" height="30" rx="8" fill="#C7D2FE"/><text x="1133.6924638832274" y="137" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">1.1e11  measured</text><text x="48" y="188" font-size="18" font-weight="700" fill="#111827" text-anchor="start">T1</text><text x="104" y="188" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">+ fused executor</text><rect x="380" y="168" width="441.4" height="30" rx="8" fill="url(#hat)" stroke="#C7D2FE"/><text x="831.4325981788721" y="189" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">4e9  projected</text><text x="48" y="240" font-size="18" font-weight="700" fill="#111827" text-anchor="start">T2</text><text x="104" y="240" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">+ SMAQA int8 (matvec only)</text><rect x="380" y="220" width="258.8" height="30" rx="8" fill="url(#hat)" stroke="#C7D2FE"/><text x="648.8026895628235" y="241" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">5.4e8  projected</text><text x="48" y="292" font-size="18" font-weight="700" fill="#111827" text-anchor="start">T3</text><text x="104" y="292" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">+ VDOT int4 (matvec only)</text><rect x="380" y="272" width="109.4" height="30" rx="8" fill="url(#hat)" stroke="#C7D2FE"/><text x="499.449752804687" y="293" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">1.05e8  projected</text><text x="48" y="344" font-size="18" font-weight="700" fill="#111827" text-anchor="start">T3m</text><text x="104" y="344" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">built: VDOT + fixed-point nonlinears</text><rect x="380" y="324" width="132.1" height="30" rx="8" fill="#C7D2FE"/><text x="522.0994625764711" y="345" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">1.35e8  measured</text><text x="48" y="396" font-size="18" font-weight="700" fill="#111827" text-anchor="start">Final</text><text x="104" y="396" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">CF + RAM, 8-bit layers 2/26/27</text><rect x="380" y="376" width="157.6" height="30" rx="8" fill="url(#acc)"/><text x="547.6221724788429" y="397" font-size="13" font-weight="600" fill="#4F46E5" text-anchor="start">1.78e8  measured</text><text x="48" y="488" font-size="12" font-weight="400" fill="#9CA3AF" text-anchor="start">T0 to T3m rows: docs/TIERS.md (T3m = built firmware, emulator count at ctx 1). Final row: this run, 178,066,316 instructions (summary.json). T1 to T3 are projections; T2 and T3 count the matvec only.</text><text x="48" y="506" font-size="12" font-weight="400" fill="#9CA3AF" text-anchor="start">The Final row includes the constants-fetch and 16-bit-activation changes (+17% instructions vs the int4 firmware, quantfix results). Instruction counts differ by firmware; see TIERS.md for the derivations.</text></svg>