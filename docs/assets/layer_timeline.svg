<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 436" width="1000" height="436" role="img" aria-labelledby="t d"><title id="t">Layer timeline</title><desc id="d">Four outer rounds per inner decoder layer, showing which lane (host, DeltaNet state, op layers, attention) works in each round.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--panel:#f6f8fa;
--state:#0969da;--statef:#ddf4ff;--op:#9a6700;--opf:#fff8c5;--att:#1a7f37;--attf:#dafbe1;--host:#57606a;--hostf:#eaeef2;--bad:#cf222e;--badf:#ffebe9;--acc:#8250df;--accf:#fbefff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--panel:#151b23;
--state:#4493f8;--statef:#0c2d6b;--op:#d4a72c;--opf:#3b2e00;--att:#3fb950;--attf:#0f3a1b;--host:#9198a1;--hostf:#262c36;--bad:#ff7b72;--badf:#4a1a1a;--acc:#bc8cff;--accf:#2d1b4e}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:20px;font-weight:600}.s{font-size:12px;fill:var(--mut)}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.wt{fill:#fff}.c{text-anchor:middle}.r{text-anchor:end}
.bg{fill:var(--bg)}.pn{fill:var(--panel);stroke:var(--line)}
.st{fill:var(--statef);stroke:var(--state);stroke-width:1.5}.op{fill:var(--opf);stroke:var(--op);stroke-width:1.5}
.at{fill:var(--attf);stroke:var(--att);stroke-width:1.5}.ho{fill:var(--hostf);stroke:var(--host);stroke-width:1.5}
.ac{fill:var(--accf);stroke:var(--acc);stroke-width:1.5}.bd{fill:var(--badf);stroke:var(--bad);stroke-width:1.5}
.ln{stroke:var(--mut);stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 5}
.flow{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs><rect class="bg" width="1000" height="436" rx="8"/><text x="24" y="34" class="t">One inner layer as a timeline of outer rounds</text><text x="24" y="54" class="s">Planned schedule from the depth rule (INTERFACE.md section 5): every op consumes the matvec result of an earlier outer forward call. Qwen2.5-0.5B: 4 rounds per layer.</text><text x="284.0" y="88" class="b c">Round 1</text><line x1="186" x2="186" y1="94" y2="372" stroke="var(--line)" stroke-dasharray="4 4"/><text x="480.0" y="88" class="b c">Round 2</text><line x1="382" x2="382" y1="94" y2="372" stroke="var(--line)" stroke-dasharray="4 4"/><text x="676.0" y="88" class="b c">Round 3</text><line x1="578" x2="578" y1="94" y2="372" stroke="var(--line)" stroke-dasharray="4 4"/><text x="872.0" y="88" class="b c">Round 4</text><line x1="774" x2="774" y1="94" y2="372" stroke="var(--line)" stroke-dasharray="4 4"/><text x="24" y="132" class="b">Host (transport only)</text><line x1="24" x2="976" y1="162" y2="162" stroke="var(--line)"/><text x="24" y="202" class="b">DeltaNet state (weights)</text><line x1="24" x2="976" y1="232" y2="232" stroke="var(--line)"/><text x="24" y="272" class="b">Compiled op layers</text><line x1="24" x2="976" y1="302" y2="302" stroke="var(--line)"/><text x="24" y="342" class="b">Attention layers + KV</text><line x1="24" x2="976" y1="372" y2="372" stroke="var(--line)"/><rect class="ho" x="190.0" y="100" width="182.0" height="54" rx="6"/><text x="281.0" y="124" class="b c c">write W_qkv tiles</text><text x="281.0" y="142" class="s c">weights, addresses, flags</text><rect class="ho" x="386.0" y="100" width="182.0" height="54" rx="6"/><text x="477.0" y="124" class="b c c">write W_o tiles</text><text x="477.0" y="142" class="s c">weights, addresses, flags</text><rect class="ho" x="582.0" y="100" width="182.0" height="54" rx="6"/><text x="673.0" y="124" class="b c c">write W_gate, W_up tiles</text><text x="673.0" y="142" class="s c">weights, addresses, flags</text><rect class="ho" x="778.0" y="100" width="182.0" height="54" rx="6"/><text x="869.0" y="124" class="b c c">write W_down tiles</text><text x="869.0" y="142" class="s c">weights, addresses, flags</text><rect class="st" x="190.0" y="170" width="182.0" height="54" rx="6"/><text x="281.0" y="194" class="b c c">q, k, v read</text><text x="281.0" y="212" class="s c">S^T x per tile</text><rect class="st" x="386.0" y="170" width="182.0" height="54" rx="6"/><text x="477.0" y="194" class="b c c">o_proj read</text><text x="477.0" y="212" class="s c">+ residual add</text><rect class="st" x="582.0" y="170" width="182.0" height="54" rx="6"/><text x="673.0" y="194" class="b c c">gate, up read</text><text x="673.0" y="212" class="s c">S^T x per tile</text><rect class="st" x="778.0" y="170" width="182.0" height="54" rx="6"/><text x="869.0" y="194" class="b c c">down read</text><text x="869.0" y="212" class="s c">+ residual add</text><rect class="op" x="190.0" y="240" width="100.10000000000001" height="54" rx="6"/><text x="240.05" y="264" class="b c c">RMSNorm 1</text><text x="240.05" y="282" class="s c">ends the round</text><rect class="op" x="478.0" y="240" width="91.0" height="54" rx="6"/><text x="523.5" y="264" class="b c c">residual</text><text x="523.5" y="282" class="s c">free</text><rect class="op" x="582.0" y="240" width="100.10000000000001" height="54" rx="6"/><text x="632.05" y="264" class="b c c">RMSNorm 2</text><text x="632.05" y="282" class="s c">ends the round</text><rect class="op" x="778.0" y="240" width="100.10000000000001" height="54" rx="6"/><text x="828.05" y="264" class="b c c">SwiGLU</text><text x="828.05" y="282" class="s c">act(gate) * up</text><rect class="at" x="386.0" y="310" width="127.39999999999999" height="54" rx="6"/><text x="449.7" y="334" class="b c c">RoPE + softmax attn</text><text x="449.7" y="352" class="s c">append k, v; read all</text><text x="190" y="396" class="s">Qwen3 adds per-head q/k norm and two gain-product rounds per layer (6 rounds). One final norm + the LM head run once per token.</text><text x="190" y="414" class="s">Status: each op and each matvec is verified separately (see README); a chained multi-round layer or token has not been demonstrated yet.</text></svg>