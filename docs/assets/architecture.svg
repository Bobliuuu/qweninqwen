<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 476" width="1000" height="476" role="img" aria-labelledby="t d"><title id="t">Architecture</title><desc id="d">Host streams weights and tokens into the outer Qwen3.5 stack, which executes the inner Qwen decoder block; the outer argmax is appended as the next token.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--panel:#f6f8fa;
--state:#0969da;--statef:#ddf4ff;--op:#9a6700;--opf:#fff8c5;--att:#1a7f37;--attf:#dafbe1;--host:#57606a;--hostf:#eaeef2;--bad:#cf222e;--badf:#ffebe9;--acc:#8250df;--accf:#fbefff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--panel:#151b23;
--state:#4493f8;--statef:#0c2d6b;--op:#d4a72c;--opf:#3b2e00;--att:#3fb950;--attf:#0f3a1b;--host:#9198a1;--hostf:#262c36;--bad:#ff7b72;--badf:#4a1a1a;--acc:#bc8cff;--accf:#2d1b4e}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:20px;font-weight:600}.s{font-size:12px;fill:var(--mut)}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.wt{fill:#fff}.c{text-anchor:middle}.r{text-anchor:end}
.bg{fill:var(--bg)}.pn{fill:var(--panel);stroke:var(--line)}
.st{fill:var(--statef);stroke:var(--state);stroke-width:1.5}.op{fill:var(--opf);stroke:var(--op);stroke-width:1.5}
.at{fill:var(--attf);stroke:var(--att);stroke-width:1.5}.ho{fill:var(--hostf);stroke:var(--host);stroke-width:1.5}
.ac{fill:var(--accf);stroke:var(--acc);stroke-width:1.5}.bd{fill:var(--badf);stroke:var(--bad);stroke-width:1.5}
.ln{stroke:var(--mut);stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 5}
.flow{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs><rect class="bg" width="1000" height="476" rx="8"/><text x="24" y="36" class="t">Architecture: an inner Qwen executed by an outer Qwen</text><text x="24" y="56" class="s">The outer model is stock Qwen3.5 code with compiled weights. The host never computes an inner activation.</text><rect class="ho" x="24" y="90" width="190" height="300" rx="8"/><text x="119" y="116" class="b c">Host streamer</text><text x="119" y="146" class="s c">inner weight rows</text><text x="119" y="172" class="s c">token ids / embeddings</text><text x="119" y="198" class="s c">one-hot addresses, flags</text><text x="119" y="224" class="s c">position ids (clock)</text><text x="119" y="250" class="s c">BALLAST constant</text><text x="119" y="302" class="b c">outer argmax + append</text><text x="119" y="346" class="s c">no inner matmul, norm,</text><text x="119" y="362" class="s c">softmax, RoPE or sampling</text><rect class="pn" x="268" y="78" width="400" height="324" rx="8"/><text x="468" y="102" class="b c">Outer Qwen3.5 (stock Qwen3_5ForCausalLM, fp32)</text><rect class="st" x="288" y="118" width="360" height="58" rx="8"/><text x="468" y="142" class="b c">DeltaNet layers = paged weight memory</text><text x="468" y="162" class="s c">state S holds a tile of W; write (k, v), read q -> S q</text><rect class="op" x="288" y="188" width="360" height="58" rx="8"/><text x="468" y="212" class="b c">Compiled op layers</text><text x="468" y="232" class="s c">RMSNorm, SwiGLU, residual, gadgets (weights only)</text><rect class="at" x="288" y="258" width="360" height="58" rx="8"/><text x="468" y="282" class="b c">Full-attention layers</text><text x="468" y="302" class="s c">RoPE + softmax over the outer KV = inner KV cache</text><rect class="ho" x="288" y="328" width="360" height="58" rx="8"/><text x="468" y="352" class="b c">Outer lm_head</text><text x="468" y="372" class="s c">decodes the in-model argmax bit code</text><path d="M214 240 L268 240" class="ln flow" marker-end="url(#ar)" /><text x="241" y="228" class="s c">frames</text><path d="M648 372 L690 372 L690 440 L119 440 L119 392" class="ln flow" marker-end="url(#ar)" /><text x="430" y="458" class="s c">outer token (argmax) is appended and becomes the next inner step</text><rect class="pn" x="712" y="78" width="264" height="300" rx="8"/><text x="844" y="102" class="b c">Inner Qwen decoder block</text><text x="844" y="120" class="s c">(the program being executed)</text><rect class="op" x="732" y="132" width="224" height="23" rx="5"/><text x="844" y="148" class="c c">RMSNorm</text><rect class="st" x="732" y="161" width="224" height="23" rx="5"/><text x="844" y="177" class="c c">q, k, v projection</text><rect class="at" x="732" y="190" width="224" height="23" rx="5"/><text x="844" y="206" class="c c">RoPE + attention (KV)</text><rect class="st" x="732" y="219" width="224" height="23" rx="5"/><text x="844" y="235" class="c c">o projection, + residual</text><rect class="op" x="732" y="248" width="224" height="23" rx="5"/><text x="844" y="264" class="c c">RMSNorm</text><rect class="st" x="732" y="277" width="224" height="23" rx="5"/><text x="844" y="293" class="c c">gate, up projection</text><rect class="op" x="732" y="306" width="224" height="23" rx="5"/><text x="844" y="322" class="c c">SwiGLU</text><rect class="st" x="732" y="335" width="224" height="23" rx="5"/><text x="844" y="351" class="c c">down projection, + residual</text><text x="844" y="396" class="s c">blue: runs in DeltaNet state</text><text x="844" y="412" class="s c">amber: compiled op layer</text><text x="844" y="428" class="s c">green: outer attention layer and KV cache</text><path d="M668 240 L712 240" class="ln dash" marker-end="url(#ar)"/></svg>