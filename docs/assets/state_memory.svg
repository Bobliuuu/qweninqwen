<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" width="1000" height="492" role="img" aria-labelledby="t d"><title id="t">DeltaNet state as weight memory</title><desc id="d">Animated: weight rows are written into a DeltaNet state matrix one key row at a time, then a query vector reads out S transposed times q.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--panel:#f6f8fa;
--state:#0969da;--statef:#ddf4ff;--op:#9a6700;--opf:#fff8c5;--att:#1a7f37;--attf:#dafbe1;--host:#57606a;--hostf:#eaeef2;--bad:#cf222e;--badf:#ffebe9;--acc:#8250df;--accf:#fbefff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--panel:#151b23;
--state:#4493f8;--statef:#0c2d6b;--op:#d4a72c;--opf:#3b2e00;--att:#3fb950;--attf:#0f3a1b;--host:#9198a1;--hostf:#262c36;--bad:#ff7b72;--badf:#4a1a1a;--acc:#bc8cff;--accf:#2d1b4e}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:20px;font-weight:600}.s{font-size:12px;fill:var(--mut)}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.wt{fill:#fff}.c{text-anchor:middle}.r{text-anchor:end}
.bg{fill:var(--bg)}.pn{fill:var(--panel);stroke:var(--line)}
.st{fill:var(--statef);stroke:var(--state);stroke-width:1.5}.op{fill:var(--opf);stroke:var(--op);stroke-width:1.5}
.at{fill:var(--attf);stroke:var(--att);stroke-width:1.5}.ho{fill:var(--hostf);stroke:var(--host);stroke-width:1.5}
.ac{fill:var(--accf);stroke:var(--acc);stroke-width:1.5}.bd{fill:var(--badf);stroke:var(--bad);stroke-width:1.5}
.ln{stroke:var(--mut);stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 5}
.flow{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs><rect class="bg" width="1000" height="492" rx="8"/><text x="24" y="34" class="t">DeltaNet state as weight memory</text><text x="24" y="54" class="s">Delta rule: S &lt;- S + k (beta (v - S^T k))^T, read: out = S^T q. With a one-hot k and beta = 1, a write overwrites row r with v.</text><text x="492.0" y="126" class="b c">state S (key rows x value columns)</text><rect class="pn" x="326" y="146" width="332" height="168" rx="4"/><rect x="332" y="152" width="50" height="36" rx="3" class="st" style="fill-opacity:0.78"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0714;0.0814;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="386" y="152" width="50" height="36" rx="3" class="st" style="fill-opacity:0.29"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0714;0.0814;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="440" y="152" width="50" height="36" rx="3" class="st" style="fill-opacity:0.50"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0714;0.0814;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="494" y="152" width="50" height="36" rx="3" class="st" style="fill-opacity:0.64"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0714;0.0814;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="548" y="152" width="50" height="36" rx="3" class="st" style="fill-opacity:0.36"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0714;0.0814;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="602" y="152" width="50" height="36" rx="3" class="st" style="fill-opacity:0.57"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0714;0.0814;1" dur="14.0s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0143;0.0243;1" dur="14.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0071;0.0143;0.1071;0.1286;1" dur="14.0s" repeatCount="indefinite"/><path d="M724 170 L664 170" class="ln" marker-end="url(#ar)"/><text x="730" y="174" class="m">write: k = e0, v = W[0, :]</text></g><rect x="332" y="192" width="50" height="36" rx="3" class="st" style="fill-opacity:0.43"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2143;0.2243;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="386" y="192" width="50" height="36" rx="3" class="st" style="fill-opacity:0.71"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2143;0.2243;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="440" y="192" width="50" height="36" rx="3" class="st" style="fill-opacity:0.22"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2143;0.2243;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="494" y="192" width="50" height="36" rx="3" class="st" style="fill-opacity:0.50"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2143;0.2243;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="548" y="192" width="50" height="36" rx="3" class="st" style="fill-opacity:0.78"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2143;0.2243;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="602" y="192" width="50" height="36" rx="3" class="st" style="fill-opacity:0.29"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2143;0.2243;1" dur="14.0s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1571;0.1671;1" dur="14.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1500;0.1571;0.2500;0.2714;1" dur="14.0s" repeatCount="indefinite"/><path d="M724 210 L664 210" class="ln" marker-end="url(#ar)"/><text x="730" y="214" class="m">write: k = e1, v = W[1, :]</text></g><rect x="332" y="232" width="50" height="36" rx="3" class="st" style="fill-opacity:0.64"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3571;0.3671;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="386" y="232" width="50" height="36" rx="3" class="st" style="fill-opacity:0.36"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3571;0.3671;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="440" y="232" width="50" height="36" rx="3" class="st" style="fill-opacity:0.57"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3571;0.3671;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="494" y="232" width="50" height="36" rx="3" class="st" style="fill-opacity:0.29"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3571;0.3671;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="548" y="232" width="50" height="36" rx="3" class="st" style="fill-opacity:0.50"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3571;0.3671;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="602" y="232" width="50" height="36" rx="3" class="st" style="fill-opacity:0.71"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3571;0.3671;1" dur="14.0s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3000;0.3100;1" dur="14.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2929;0.3000;0.3929;0.4143;1" dur="14.0s" repeatCount="indefinite"/><path d="M724 250 L664 250" class="ln" marker-end="url(#ar)"/><text x="730" y="254" class="m">write: k = e2, v = W[2, :]</text></g><rect x="332" y="272" width="50" height="36" rx="3" class="st" style="fill-opacity:0.29"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5000;0.5100;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="386" y="272" width="50" height="36" rx="3" class="st" style="fill-opacity:0.57"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5000;0.5100;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="440" y="272" width="50" height="36" rx="3" class="st" style="fill-opacity:0.78"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5000;0.5100;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="494" y="272" width="50" height="36" rx="3" class="st" style="fill-opacity:0.43"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5000;0.5100;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="548" y="272" width="50" height="36" rx="3" class="st" style="fill-opacity:0.22"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5000;0.5100;1" dur="14.0s" repeatCount="indefinite"/></rect><rect x="602" y="272" width="50" height="36" rx="3" class="st" style="fill-opacity:0.64"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5000;0.5100;1" dur="14.0s" repeatCount="indefinite"/></rect><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4429;0.4529;1" dur="14.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4357;0.4429;0.5357;0.5571;1" dur="14.0s" repeatCount="indefinite"/><path d="M724 290 L664 290" class="ln" marker-end="url(#ar)"/><text x="730" y="294" class="m">write: k = e3, v = W[3, :]</text></g><g><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6786;0.7000;1" dur="14.0s" repeatCount="indefinite"/><text x="260" y="175" class="m r">q0 = +0.50</text><path d="M264 170 L322 170" class="ln" marker-end="url(#ar)"/><text x="260" y="215" class="m r">q1 = -1.00</text><path d="M264 210 L322 210" class="ln" marker-end="url(#ar)"/><text x="260" y="255" class="m r">q2 = +0.25</text><path d="M264 250 L322 250" class="ln" marker-end="url(#ar)"/><text x="260" y="295" class="m r">q3 = +2.00</text><path d="M264 290 L322 290" class="ln" marker-end="url(#ar)"/><rect class="ac" x="326" y="334" width="332" height="34" rx="4"/><text x="357.0" y="356" class="m c">+0.62</text><text x="411.0" y="356" class="m c">+0.57</text><text x="465.0" y="356" class="m c">+2.10</text><text x="519.0" y="356" class="m c">+0.70</text><text x="573.0" y="356" class="m c">-0.43</text><text x="627.0" y="356" class="m c">+1.70</text><text x="316" y="356" class="b r">out = S^T q</text></g><text x="24" y="410" class="s">WRITE frames (host transport): one-hot address, weight payload, flags.</text><text x="24" y="430" class="s">READ frame (in-model): the activation q is produced by outer layers; the contraction S^T q happens inside the delta-rule layer.</text><text x="24" y="450" class="s">Per-head q, k are L2-normalised and pass a conv SiLU, v goes through a gated RMSNorm: the engine compensates with ballast channels and a</text><text x="24" y="468" class="s">pre-inverted SiLU payload (weights only). See experiments/state/README.md. Values above are illustrative, not data.</text></svg>