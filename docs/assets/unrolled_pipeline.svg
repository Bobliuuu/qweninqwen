<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d"><title id="t">Unrolled pipeline</title><desc id="d">Each inner op occupies its own outer layers in dependency order; registers are DeltaNet layers placed between producer and consumer; one forward call per inner token.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--panel:#f6f8fa;
--state:#0969da;--statef:#ddf4ff;--op:#9a6700;--opf:#fff8c5;--att:#1a7f37;--attf:#dafbe1;--host:#57606a;--hostf:#eaeef2;--bad:#cf222e;--badf:#ffebe9;--acc:#8250df;--accf:#fbefff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--panel:#151b23;
--state:#4493f8;--statef:#0c2d6b;--op:#d4a72c;--opf:#3b2e00;--att:#3fb950;--attf:#0f3a1b;--host:#9198a1;--hostf:#262c36;--bad:#ff7b72;--badf:#4a1a1a;--acc:#bc8cff;--accf:#2d1b4e}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:20px;font-weight:600}.s{font-size:12px;fill:var(--mut)}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.wt{fill:#fff}.c{text-anchor:middle}.r{text-anchor:end}
.bg{fill:var(--bg)}.pn{fill:var(--panel);stroke:var(--line)}
.st{fill:var(--statef);stroke:var(--state);stroke-width:1.5}.op{fill:var(--opf);stroke:var(--op);stroke-width:1.5}
.at{fill:var(--attf);stroke:var(--att);stroke-width:1.5}.ho{fill:var(--hostf);stroke:var(--host);stroke-width:1.5}
.ac{fill:var(--accf);stroke:var(--acc);stroke-width:1.5}.bd{fill:var(--badf);stroke:var(--bad);stroke-width:1.5}
.ln{stroke:var(--mut);stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 5}
.flow{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs><rect class="bg" width="1000" height="440" rx="8"/><text x="24" y="34" class="t">The unrolled pipeline: one inner token in one outer forward call</text><text x="24" y="54" class="s">State and KV only carry data deeper (to layers at or below the layer that holds them), so each inner op gets its own outer layers, in dependency order.</text><text x="24" y="90" class="b">depth (outer layers)  -></text><text x="976" y="90" class="s r">real model: 1006 outer layers, D = 40775</text><rect class="op" x="24" y="106" width="140" height="64" rx="6"/><text x="94.0" y="134" class="b c">RMSNorm</text><text x="94.0" y="154" class="s c">GDN gated-norm head</text><path d="M166 138.0 L184 138.0" class="ln" marker-end="url(#ar)" /><rect class="st" x="186" y="106" width="140" height="64" rx="6"/><text x="256.0" y="134" class="b c">W_qkv bank</text><text x="256.0" y="154" class="s c">GDN state read</text><path d="M328 138.0 L346 138.0" class="ln" marker-end="url(#ar)" /><rect class="st" x="348" y="106" width="140" height="64" rx="6"/><text x="418.0" y="134" class="b c">register</text><text x="418.0" y="154" class="s c">GDN state</text><path d="M490 138.0 L508 138.0" class="ln" marker-end="url(#ar)" /><rect class="op" x="510" y="106" width="140" height="64" rx="6"/><text x="580.0" y="134" class="b c">q/k norm</text><text x="580.0" y="154" class="s c">norm + gain product</text><path d="M652 138.0 L670 138.0" class="ln" marker-end="url(#ar)" /><rect class="at" x="672" y="106" width="140" height="64" rx="6"/><text x="742.0" y="134" class="b c">RoPE + attention</text><text x="742.0" y="154" class="s c">outer KV = inner KV</text><path d="M814 138.0 L832 138.0" class="ln" marker-end="url(#ar)" /><rect class="st" x="834" y="106" width="140" height="64" rx="6"/><text x="904.0" y="134" class="b c">register</text><text x="904.0" y="154" class="s c">GDN state</text><path d="M904.0 172 L904.0 184 L94.0 184 L94.0 204" class="ln" marker-end="url(#ar)" /><rect class="st" x="24" y="206" width="140" height="64" rx="6"/><text x="94.0" y="234" class="b c">W_o bank</text><text x="94.0" y="254" class="s c">read + residual</text><path d="M166 238.0 L184 238.0" class="ln" marker-end="url(#ar)" /><rect class="op" x="186" y="206" width="140" height="64" rx="6"/><text x="256.0" y="234" class="b c">RMSNorm</text><text x="256.0" y="254" class="s c">GDN gated-norm head</text><path d="M328 238.0 L346 238.0" class="ln" marker-end="url(#ar)" /><rect class="st" x="348" y="206" width="140" height="64" rx="6"/><text x="418.0" y="234" class="b c">W_gate, W_up bank</text><text x="418.0" y="254" class="s c">GDN state read</text><path d="M490 238.0 L508 238.0" class="ln" marker-end="url(#ar)" /><rect class="op" x="510" y="206" width="140" height="64" rx="6"/><text x="580.0" y="234" class="b c">SwiGLU</text><text x="580.0" y="254" class="s c">MLP gadget</text><path d="M652 238.0 L670 238.0" class="ln" marker-end="url(#ar)" /><rect class="st" x="672" y="206" width="140" height="64" rx="6"/><text x="742.0" y="234" class="b c">register</text><text x="742.0" y="254" class="s c">GDN state</text><path d="M814 238.0 L832 238.0" class="ln" marker-end="url(#ar)" /><rect class="st" x="834" y="206" width="140" height="64" rx="6"/><text x="904.0" y="234" class="b c">W_down bank</text><text x="904.0" y="254" class="s c">read + residual</text><text x="24" y="316" class="s">repeat for each inner layer, then:</text><rect class="op" x="24" y="326" width="150" height="40" rx="6"/><text x="99" y="351" class="b c">final RMSNorm</text><path d="M176 346 L198 346" class="ln" marker-end="url(#ar)" /><rect class="st" x="200" y="326" width="150" height="40" rx="6"/><text x="275" y="351" class="b c">LM-head bank</text><path d="M352 346 L374 346" class="ln" marker-end="url(#ar)" /><rect class="at" x="376" y="326" width="150" height="40" rx="6"/><text x="451" y="351" class="b c">argmax attention</text><path d="M528 346 L550 346" class="ln" marker-end="url(#ar)" /><rect class="ho" x="552" y="326" width="150" height="40" rx="6"/><text x="627" y="351" class="b c">outer lm_head</text><path d="M706 346 L760 346" class="ln" marker-end="url(#ar)" /><rect class="ho" x="762" y="326" width="214" height="40" rx="6"/><text x="869" y="351" class="b c">host: argmax + append</text><text x="24" y="400" class="s">Weights are paged in the same call: WRITE frames precede the READ frame of each bank, one chunked prefill per inner token.</text><text x="24" y="418" class="s">The only deep-to-shallow channel is the emitted token: outer argmax, host append, next embedding row. Real Qwen3-0.6B: 293,068 outer frames per token. Toy: 1530. Schematic order.</text></svg>