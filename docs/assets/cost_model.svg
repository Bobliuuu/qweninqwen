<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d"><title id="t">Cost model: Qwen3-0.6B inside the outer model, seconds per token</title><desc id="d">Top row: one full token incl. all norms, attention, LM head and argmax (single position). Other rows: weight streaming alone through a shallow bank (experiments/run/).</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--panel:#f6f8fa;
