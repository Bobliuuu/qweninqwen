78537031645" y="157" class="m">110 s  2048 floats/step; untested</text><text x="318" y="203" class="b r">weight streaming only, nL=4 bank (measured)</text><rect x="330" y="184" width="324.5" height="30" rx="4" fill="var(--state)" fill-opacity="0.9" stroke="var(--state)" stroke-width="1.5"/><text x="662.5463930329438" y="203" class="m">42 s  A10G, 519,430 frames</text><text x="318" y="249" class="b r">weight streaming only, nL=2 (extrapolated)</text><rect x="330" y="230" width="255.8" height="30" rx="4" fill="var(--state)" fill-opacity="0.35" stroke="var(--state)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="593.7507201905657" y="249" class="m">19 s  plan() estimate</text><text x="318" y="295" class="b r">weight streaming only, nL=1 (extrapolated)</text><rect x="330" y="276" width="169.0" height="30" rx="4" fill="var(--state)" fill-opacity="0.35" stroke="var(--state)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="507.0196080028513" y="295" class="m">7 s  plan() estimate</text><text x="330" y="374" class="s">seconds per inner token (log scale)  -  solid = measured, translucent dashed = estimate / extrapolation</text><text x="24" y="392" class="s">Full token: 13.9 s layer building + ~242 s running, torch-reference GDN, fp32, untuned, shared GPU (experiments/vslice/FULL_TOKEN_RESULT.md).</text><text x="24" y="408" class="s">Streaming-only rows use harness-fed random activations and a shallow stack: they do not add up to, or compare directly with, the full-token row.</text></svg>