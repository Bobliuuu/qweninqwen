<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d"><title id="t">Circuit route vs state-as-memory route (seconds per inner token)</title><desc id="d">Same inner model size (~0.5-0.6 B weights). Circuit: bit-level arithmetic in GDN state (reference/). State route: weights written into the state, contraction done by the delta-rule read.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--line:#d1d9e0;--panel:#f6f8fa;
--state:#0969da;--statef:#ddf4ff;--op:#9a6700;--opf:#fff8c5;--att:#1a7f37;--attf:#dafbe1;--host:#57606a;--hostf:#eaeef2;--bad:#cf222e;--badf:#ffebe9;--acc:#8250df;--accf:#fbefff}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--line:#3d444d;--panel:#151b23;
--state:#4493f8;--statef:#0c2d6b;--op:#d4a72c;--opf:#3b2e00;--att:#3fb950;--attf:#0f3a1b;--host:#9198a1;--hostf:#262c36;--bad:#ff7b72;--badf:#4a1a1a;--acc:#bc8cff;--accf:#2d1b4e}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:20px;font-weight:600}.s{font-size:12px;fill:var(--mut)}.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.wt{fill:#fff}.c{text-anchor:middle}.r{text-anchor:end}
.bg{fill:var(--bg)}.pn{fill:var(--panel);stroke:var(--line)}
.st{fill:var(--statef);stroke:var(--state);stroke-width:1.5}.op{fill:var(--opf);stroke:var(--op);stroke-width:1.5}
.at{fill:var(--attf);stroke:var(--att);stroke-width:1.5}.ho{fill:var(--hostf);stroke:var(--host);stroke-width:1.5}
.ac{fill:var(--accf);stroke:var(--acc);stroke-width:1.5}.bd{fill:var(--badf);stroke:var(--bad);stroke-width:1.5}
.ln{stroke:var(--mut);stroke-width:1.6;fill:none}.dash{stroke-dasharray:6 5}
.flow{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}
</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker></defs><rect class="bg" width="1000" height="430" rx="8"/><text x="24" y="34" class="t">Circuit route vs state-as-memory route (seconds per inner token)</text><text x="24" y="54" class="s">Same inner model size (~0.5-0.6 B weights). Circuit: bit-level arithmetic in GDN state (reference/). State route: weights written into the state, contraction done by the delta-rule read.</text><line x1="366.8100094515522" x2="366.8100094515522" y1="78" y2="334" stroke="var(--line)"/><text x="366.8100094515522" y="350" class="s c">1 s</text><line x1="491.9896326887116" x2="491.9896326887116" y1="78" y2="334" stroke="var(--line)"/><text x="491.9896326887116" y="350" class="s c">1 min</text><line x1="617.1692559258709" x2="617.1692559258709" y1="78" y2="334" stroke="var(--line)"/><text x="617.1692559258709" y="350" class="s c">1 h</text><line x1="714.3344004476735" x2="714.3344004476735" y1="78" y2="334" stroke="var(--line)"/><text x="714.3344004476735" y="350" class="s c">1 day</text><line x1="818.3218886332332" x2="818.3218886332332" y1="78" y2="334" stroke="var(--line)"/><text x="818.3218886332332" y="350" class="s c">30 d</text><line x1="894.7166122121232" x2="894.7166122121232" y1="78" y2="334" stroke="var(--line)"/><text x="894.7166122121232" y="350" class="s c">1 yr</text><text x="318" y="111" class="b r">circuit route, real 896-row (measured)</text><rect x="330" y="92" width="566.6" height="30" rx="4" fill="var(--bad)" fill-opacity="0.9" stroke="var(--bad)" stroke-width="1.5"/><text x="340" y="111" class="m wt">33,582,597 s  14.7 MAC/s, 389 days</text><text x="318" y="157" class="b r">circuit route, best synthetic (measured)</text><rect x="330" y="138" width="459.5" height="30" rx="4" fill="var(--bad)" fill-opacity="0.9" stroke="var(--bad)" stroke-width="1.5"/><text x="340" y="157" class="m wt">1,011,052 s  488 MAC/s, 11.7 days</text><text x="318" y="203" class="b r">state route, full token (measured)</text><rect x="330" y="184" width="207.8" height="30" rx="4" fill="var(--state)" fill-opacity="0.9" stroke="var(--state)" stroke-width="1.5"/><text x="545.8160331858109" y="203" class="m">269 s  real Qwen3-0.6B, 1 position, A100</text><text x="318" y="249" class="b r">state route, matvecs only (measured)</text><rect x="330" y="230" width="151.0" height="30" rx="4" fill="var(--state)" fill-opacity="0.9" stroke="var(--state)" stroke-width="1.5"/><text x="489.048309467025" y="249" class="m">42 s  A10G, 596M weights</text><text x="318" y="295" class="b r">MLP-multiplier, MACs only (estimate)</text><rect x="330" y="276" width="23.2" height="30" rx="4" fill="var(--acc)" fill-opacity="0.35" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="361.1653221240379" y="295" class="m">0.64 s  0.77 GMAC/s A100; host copies x (flagged)</text><text x="330" y="374" class="s">seconds per inner token (log scale)  -  solid = measured, translucent dashed = estimate / extrapolation</text><text x="24" y="392" class="s">Circuit rows extrapolate measured MAC/s (reference/nested-qwen-lab, experiments/bench/circuit_baseline) to 494M MACs; they exclude all non-matvec ops.</text><text x="24" y="408" class="s">State rows: full token incl. all ops (experiments/vslice) and weight streaming alone. MLP-multiplier row: estimate (experiments/alt/FINDINGS.md).</text></svg>